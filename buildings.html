<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楼宇指南 · 齐鲁会诊</title>
<style>
:root {
  --blue: #2563eb; --blue-light: #eff6ff; --bg: #f8fafc; --card: #fff;
  --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
  --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #1e40af, #2563eb, #3b82f6);
  color: #fff; padding: 20px 0; box-shadow: 0 2px 16px rgba(37,99,235,.15);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 20px; font-weight: 700; }
.header a { color: #fff; text-decoration: none; font-size: 13px; opacity: .8; }
.header a:hover { opacity: 1; }
.main { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; }

/* 楼栋切换标签 */
.tabs {
  display: flex; gap: 0; margin-bottom: 20px; background: var(--card);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.tab {
  flex: 1; padding: 14px 24px; text-align: center; cursor: pointer;
  font-size: 15px; font-weight: 600; color: var(--text-secondary);
  border: none; background: transparent; transition: all .2s;
  border-bottom: 3px solid transparent;
}
.tab:hover { color: var(--text); background: #f8fafc; }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); background: var(--blue-light); }

/* 搜索 */
.search-box {
  display: flex; align-items: center; background: var(--card);
  border: 2px solid var(--border); border-radius: 50px;
  padding: 10px 20px; margin-bottom: 20px; transition: border-color .2s;
}
.search-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.search-box svg { flex-shrink: 0; color: #94a3b8; }
.search-box input {
  flex: 1; border: none; outline: none; font-size: 15px;
  padding: 8px 12px; background: transparent;
}
.search-box input::placeholder { color: #94a3b8; }

.layout { display: grid; grid-template-columns: 1fr 400px; gap: 24px; align-items: start; }

.image-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border);
}
.image-card img { width: 100%; display: block; cursor: zoom-in; }

.floor-list { display: flex; flex-direction: column; gap: 10px; }
.floor-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--border);
  overflow: hidden; transition: box-shadow .2s;
}
.floor-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.floor-card.active { border-color: var(--blue); }
.floor-head {
  display: flex; align-items: center; padding: 14px 18px;
  cursor: pointer; user-select: none; gap: 12px;
}
.floor-head:hover { background: #f8fafc; }
.floor-badge {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0;
}
.bg-blue { background: #2563eb; } .bg-teal { background: #0d9488; }
.bg-amber { background: #d97706; } .bg-purple { background: #7c3aed; }
.bg-red { background: #dc2626; }
.floor-name { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; }
.floor-depts { font-size: 13px; color: var(--text-secondary); }
.floor-body { display: none; padding: 0 18px 16px; border-top: 1px solid var(--border); }
.floor-body.open { display: block; }
.dept-tag {
  display: inline-block; padding: 5px 14px; margin: 4px 6px 4px 0;
  background: var(--blue-light); color: var(--blue);
  border-radius: 20px; font-size: 13px;
}

.overlay {
  display: none; position: fixed; top:0;left:0;right:0;bottom:0;
  background: rgba(0,0,0,.9); z-index: 200;
  align-items: center; justify-content: center; cursor: zoom-out;
}
.overlay.show { display: flex; }
.overlay img { max-width: 95vw; max-height: 95vh; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .image-card { order: 2; } .floor-list { order: 1; }
  .tabs { flex-direction: column; }
}
.footer { text-align: center; padding: 24px; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-title">🏗️ 楼宇指南</div>
    <a href="index.html">← 会诊查询</a>
  </div>
</header>

<main class="main">

  <!-- 楼栋切换 -->
  <div class="tabs">
    <button class="tab active" onclick="switchBuilding('huamei')">🏥 华美楼</button>
    <button class="tab" onclick="switchBuilding('qilu-south')">🏢 齐鲁楼南塔</button>
  </div>

  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="搜索科室名称…" oninput="filterFloors()">
  </div>

  <div class="layout">
    <div class="image-card" onclick="toggleZoom()">
      <img id="buildingImg" src="huamei-building.jpg" alt="楼层布局">
    </div>
    <div class="floor-list" id="floorList"></div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="toggleZoom()">
  <img id="overlayImg" src="huamei-building.jpg" alt="楼层布局">
</div>

<div class="footer">💡 点击图片放大查看 · 搜索科室快速定位</div>

<script>
const buildings = {
  'huamei': {
    name: '华美楼',
    image: 'huamei-building.jpg',
    floors: [
      { floor:"B1", name:"地下一层", c:"bg-amber", depts:["职工餐厅","病案室","技能培训中心"] },
      { floor:"1F", name:"一层", c:"bg-blue", depts:["急诊科"] },
      { floor:"2F", name:"二层", c:"bg-teal", depts:["急诊内科病房","急诊观察"] },
      { floor:"3F", name:"三层", c:"bg-purple", depts:["图书馆","院史馆（办公区）"] },
      { floor:"4F", name:"四层", c:"bg-blue", depts:["干部保健科","消化内科"] },
      { floor:"5F", name:"五层", c:"bg-teal", depts:["保健科门诊","呼吸与危重症"] },
      { floor:"6F", name:"六层", c:"bg-purple", depts:["全科医学科病房"] },
      { floor:"7F", name:"七层", c:"bg-blue", depts:["全科医学科病房","康复科"] },
      { floor:"8F", name:"八层", c:"bg-teal", depts:["检验科","输血科"] },
      { floor:"9F", name:"九层", c:"bg-purple", depts:["检验科","输血科"] },
      { floor:"10F", name:"十层", c:"bg-amber", depts:["技能培训中心","动物实验室"] },
      { floor:"11F", name:"十一层", c:"bg-blue", depts:["报告厅"] }
    ]
  },
  'qilu-south': {
    name: '齐鲁楼南塔',
    image: 'qilu-south-building.jpg',
    floors: [
      { floor:"B1", name:"地下一层", c:"bg-amber", depts:["药库","设备科"] },
      { floor:"F1", name:"一层", c:"bg-blue", depts:["住院处","收费处","入院准备中心"] },
      { floor:"F2", name:"二层", c:"bg-teal", depts:["手术室","麻醉恢复室"] },
      { floor:"F3", name:"三层", c:"bg-purple", depts:["重症医学科(ICU)"] },
      { floor:"F4", name:"四层", c:"bg-red", depts:["产房","新生儿科"] },
      { floor:"F5", name:"五层", c:"bg-blue", depts:["急诊内科一病区"] },
      { floor:"F6", name:"六层", c:"bg-teal", depts:["消化内科病区"] },
      { floor:"F7", name:"七层", c:"bg-purple", depts:["肾内科一病区"] },
      { floor:"F8", name:"八层", c:"bg-blue", depts:["呼吸与危重症医学科病区"] },
      { floor:"F9", name:"九层", c:"bg-teal", depts:["消化内科一病区"] },
      { floor:"F10", name:"十层", c:"bg-purple", depts:["内分泌与代谢病科一病区"] },
      { floor:"F11", name:"十一层", c:"bg-blue", depts:["心血管内科病区"] },
      { floor:"F12", name:"十二层", c:"bg-teal", depts:["心血管内科CCU"] },
      { floor:"F13", name:"十三层", c:"bg-purple", depts:["神经内科病区"] }
    ]
  }
};

let currentBuilding = 'huamei';
let expandedFloors = {};

function switchBuilding(key) {
  currentBuilding = key;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.includes(buildings[key].name)));
  document.getElementById('buildingImg').src = buildings[key].image;
  document.getElementById('overlayImg').src = buildings[key].image;
  expandedFloors = {};
  renderFloors('');
}

function renderFloors(filter) {
  const kw = (filter || '').toLowerCase();
  const b = buildings[currentBuilding];
  let items = b.floors;
  if (kw) items = items.filter(f => f.depts.some(d => d.toLowerCase().includes(kw)) || f.name.includes(kw));

  document.getElementById('floorList').innerHTML = items.map(f => {
    const open = expandedFloors[f.floor] || (kw.length > 0);
    return `
      <div class="floor-card ${open ? 'active' : ''}">
        <div class="floor-head" onclick="toggleFloor('${f.floor}')">
          <div class="floor-badge ${f.c}">${f.floor}</div>
          <div class="floor-name">${f.name}</div>
          <div class="floor-depts">${f.depts.join(' · ')}</div>
        </div>
        <div class="floor-body ${open ? 'open' : ''}">
          ${f.depts.map(d => `<span class="dept-tag">${d}</span>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleFloor(floor) {
  expandedFloors[floor] = !expandedFloors[floor];
  renderFloors(document.getElementById('searchInput').value);
}
function filterFloors() { renderFloors(document.getElementById('searchInput').value); }
function toggleZoom() { document.getElementById('overlay').classList.toggle('show'); }

renderFloors('');
</script>
</body>
</html>
