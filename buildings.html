<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楼宇指南 · 齐鲁会诊</title>
<style>
:root {
  --blue: #2563eb; --bg: #f8fafc; --card: #fff;
  --text: #1e293b; --text-secondary: #64748b;
  --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6;
}

/* 顶栏 */
.header {
  background: linear-gradient(135deg, #1e40af, #2563eb, #3b82f6);
  color: #fff; padding: 20px 0; box-shadow: 0 2px 16px rgba(37,99,235,.15);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 20px; font-weight: 700; }
.header a { color: #fff; text-decoration: none; font-size: 13px; opacity: .8; }
.header a:hover { opacity: 1; }

/* 主内容 */
.main { max-width: 1100px; margin: 0 auto; padding: 28px 28px 60px; }

/* 楼栋卡片 */
.building-section { margin-bottom: 36px; }
.building-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.building-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff;
}
.icon-blue { background: linear-gradient(135deg, #2563eb, #3b82f6); }
.icon-teal { background: linear-gradient(135deg, #0d9488, #14b8a6); }
.building-name { font-size: 22px; font-weight: 700; }
.building-sub { font-size: 13px; color: var(--text-secondary); }

.image-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; border: 1px solid #e2e8f0;
  cursor: zoom-in; transition: box-shadow .2s;
}
.image-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.1); }
.image-card img { width: 100%; display: block; }

/* 全屏查看 */
.overlay {
  display: none; position: fixed; top:0;left:0;right:0;bottom:0;
  background: rgba(0,0,0,.92); z-index: 200;
  align-items: center; justify-content: center; cursor: zoom-out; flex-direction: column;
}
.overlay.show { display: flex; }
.overlay img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }
.overlay-hint { color: rgba(255,255,255,.5); font-size: 13px; margin-top: 16px; }

.footer { text-align: center; padding: 24px; color: #94a3b8; font-size: 12px; }

@media (max-width: 768px) {
  .main { padding: 16px 14px 40px; }
  .building-name { font-size: 18px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-title">🏗️ 楼宇指南</div>
    <a href="index.html">← 会诊查询</a>
  </div>
</header>

<main class="main">

  <!-- 华美楼 -->
  <section class="building-section">
    <div class="building-header">
      <div class="building-icon icon-blue">🏥</div>
      <div>
        <div class="building-name">华美楼</div>
        <div class="building-sub">楼层科室布局</div>
      </div>
    </div>
    <div class="image-card" onclick="zoomImage('huamei')">
      <img src="huamei-building.jpg" alt="华美楼楼层布局">
    </div>
  </section>

  <!-- 齐鲁楼南塔 -->
  <section class="building-section">
    <div class="building-header">
      <div class="building-icon icon-teal">🏢</div>
      <div>
        <div class="building-name">齐鲁楼南塔</div>
        <div class="building-sub">楼层科室布局</div>
      </div>
    </div>
    <div class="image-card" onclick="zoomImage('qilu')">
      <img src="qilu-south-building.jpg" alt="齐鲁楼南塔楼层布局">
    </div>
  </section>

</main>

<!-- 全屏 -->
<div class="overlay" id="overlay" onclick="closeZoom()">
  <img id="overlayImg" src="" alt="">
  <div class="overlay-hint">点击任意位置关闭</div>
</div>

<div class="footer">💡 点击图片放大查看</div>

<script>
function zoomImage(type) {
  const img = type === 'huamei'
    ? 'huamei-building.jpg'
    : 'qilu-south-building.jpg';
  document.getElementById('overlayImg').src = img;
  document.getElementById('overlay').classList.add('show');
}
function closeZoom() {
  document.getElementById('overlay').classList.remove('show');
}
</script>
</body>
</html>
