<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>齐鲁会诊 · 每月更新版</title>
<style>
:root {
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --red: #dc2626;
  --red-light: #fef2f2;
  --bg: #f8fafc;
  --card: #fff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6;
  min-height: 100vh;
}

/* ========== 顶部导航 ========== */
.header {
  background: linear-gradient(135deg, #1e40af 0%, #2563eb 40%, #3b82f6 100%);
  color: #fff; padding: 28px 0 24px; box-shadow: 0 2px 16px rgba(37,99,235,.15);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
.header-stats {
  display: flex; gap: 24px; font-size: 13px; opacity: .85;
}
.header-stats span { white-space: nowrap; }
.header-stats .num { font-weight: 700; font-size: 18px; }

/* ========== 搜索栏 ========== */
.search-bar {
  position: sticky; top: 84px; z-index: 99;
  background: var(--bg); padding: 16px 0 8px;
}
.search-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 28px;
}
.search-box {
  display: flex; align-items: center; background: var(--card);
  border: 2px solid var(--border); border-radius: 50px;
  padding: 10px 20px; transition: border-color .2s, box-shadow .2s;
}
.search-box:focus-within {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.search-box svg { flex-shrink: 0; color: #94a3b8; }
.search-box input {
  flex: 1; border: none; outline: none; font-size: 15px;
  padding: 8px 12px; background: transparent; color: var(--text);
}
.search-box input::placeholder { color: #94a3b8; }
.search-clear {
  width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0;
  color: #64748b; border: none; font-size: 14px; cursor: pointer;
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.search-clear.visible { display: flex; }
.search-hint {
  max-width: 1100px; margin: 6px auto 0; padding: 0 28px;
  font-size: 13px; color: var(--text-secondary); display: none;
}
.search-hint.visible { display: block; }

/* ========== 主内容区 ========== */
.main {
  max-width: 1100px; margin: 0 auto; padding: 12px 28px 60px;
}

/* 网格布局：桌面端两列 */
.card-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
}

/* ========== 卡片 ========== */
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  transition: box-shadow .2s;
  border: 1px solid var(--border);
}
.card:hover { box-shadow: var(--shadow-md); }

/* 急会诊卡片 */
.card.emergency {
  border-left: 4px solid var(--red);
  background: var(--red-light);
}
.card.emergency .card-head {
  background: linear-gradient(90deg, #fee2e2, #fff);
}
.card.emergency .card-name { color: #b91c1c; }

/* 急会诊占满整行 */
.card.emergency-full { grid-column: 1 / -1; }

/* 卡片头部 */
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; cursor: pointer; user-select: none;
  transition: background .15s;
}
.card-head:hover { background: #f8fafc; }
.card.emergency .card-head:hover { background: #fef2f2; }
.card-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.card-icon { font-size: 20px; flex-shrink: 0; }
.card-name { font-size: 16px; font-weight: 600; color: var(--text); }
.card-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  background: #fef3c7; color: #92400e; white-space: nowrap;
}
.card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.quick-call {
  width: 38px; height: 38px; border-radius: 50%; background: var(--blue-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; text-decoration: none; transition: background .15s;
}
.quick-call:hover { background: #dbeafe; }
.chevron {
  font-size: 18px; color: #94a3b8; transition: transform .25s;
  flex-shrink: 0;
}
.chevron.open { transform: rotate(90deg); }

/* 卡片展开内容 */
.card-body { display: none; padding: 0 20px 16px; border-top: 1px solid var(--border); }
.card-body.open { display: block; }
.entry {
  padding: 14px 0; border-bottom: 1px solid #f1f5f9;
}
.entry:last-child { border-bottom: none; padding-bottom: 4px; }

/* 子专业标题 */
.entry-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 6px;
}
.entry-meta {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;
  display: flex; flex-wrap: wrap; gap: 8px 16px;
}
.entry-meta-item { display: flex; align-items: center; gap: 4px; }
.entry-meta-label { color: #94a3b8; font-size: 12px; }

/* 电话行 */
.phone-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: #f8fafc; border-radius: 10px;
  gap: 12px;
}
.phone-link {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: inherit; flex: 1; min-width: 0;
}
.phone-link:hover .phone-num { text-decoration: underline; }
.phone-icon-circle {
  width: 36px; height: 36px; border-radius: 50%; background: #dbeafe;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.phone-detail { min-width: 0; }
.phone-num {
  font-size: 16px; font-weight: 700; color: var(--blue); letter-spacing: .5px;
}
.phone-full-num {
  font-size: 11px; color: #94a3b8; margin-left: 6px; white-space: nowrap;
}
.phone-label { font-size: 11px; color: #94a3b8; margin-top: 1px; }
.copy-btn {
  padding: 7px 16px; background: var(--blue-light); color: var(--blue);
  border: 1px solid #bfdbfe; border-radius: 8px; font-size: 12px;
  cursor: pointer; white-space: nowrap; transition: all .15s;
}
.copy-btn:hover { background: #dbeafe; border-color: #93c5fd; }

/* ========== 收藏按钮 ========== */
.fav-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: #fffbeb; color: #d97706; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.fav-btn:hover { background: #fef3c7; transform: scale(1.08); }
.fav-btn.on { background: #fef3c7; color: #f59e0b; }

/* 收藏分组分隔线 */
.section-divider {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  color: var(--text-secondary); font-size: 13px; font-weight: 600;
  padding: 8px 4px 0; margin-top: 4px;
}
.section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ========== 底部快捷入口 ========== */
.quick-links {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  max-width: 1100px; margin: 10px auto 0; padding: 0 28px;
}
.ql-item {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px; cursor: pointer;
  text-decoration: none; color: var(--text); font-family: inherit; font-size: 14px;
  transition: all .15s;
}
.ql-item:hover { border-color: #bfdbfe; box-shadow: var(--shadow-md); transform: translateY(-1px); }
.ql-icon { font-size: 22px; flex-shrink: 0; }
.ql-text { min-width: 0; }
.ql-text b { display: block; font-size: 14.5px; font-weight: 700; }
.ql-text small { color: var(--text-secondary); font-size: 12px; }

/* ========== 反馈弹窗 ========== */
.modal {
  display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 500;
  background: rgba(15,23,42,.5); padding: 20px; overflow-y: auto;
  align-items: center; justify-content: center;
}
.modal.show { display: flex; }
.modal-box {
  background: var(--card); border-radius: 16px; width: 100%; max-width: 460px;
  padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 88vh; overflow-y: auto;
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
.modal-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.modal-box select, .modal-box input, .modal-box textarea {
  width: 100%; margin-top: 6px; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--text);
  background: #fff; outline: none; transition: border-color .15s;
}
.modal-box textarea { min-height: 96px; resize: vertical; }
.modal-box select:focus, .modal-box input:focus, .modal-box textarea:focus { border-color: var(--blue); }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions button {
  flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit; border: 1px solid var(--border);
  background: #fff; color: var(--text);
}
.modal-actions .primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.modal-actions .primary:disabled { opacity: .6; cursor: default; }

/* ========== 空状态 ========== */
.empty-state {
  text-align: center; padding: 80px 20px; color: var(--text-secondary);
  grid-column: 1 / -1;
}
.empty-icon { font-size: 56px; margin-bottom: 16px; opacity: .6; }
.empty-state p { font-size: 16px; }
.empty-state .sub { font-size: 13px; color: #94a3b8; margin-top: 6px; }

/* ========== Toast ========== */
.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: #fff; padding: 10px 28px;
  border-radius: 10px; font-size: 14px; z-index: 999; pointer-events: none;
  opacity: 0; transition: opacity .3s, transform .3s;
  transform: translateX(-50%) translateY(10px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 底部 ========== */
.footer {
  text-align: center; padding: 32px; color: #94a3b8; font-size: 12px;
  max-width: 1100px; margin: 0 auto;
}

/* ========== 响应式：手机端 ========== */
@media (max-width: 768px) {
  .card-grid { grid-template-columns: 1fr; }
  .card.emergency-full { grid-column: 1; }
  .header-inner { flex-direction: column; gap: 8px; align-items: flex-start; }
  .header-stats { gap: 16px; }
  .header-title { font-size: 19px; }
  .main { padding: 8px 14px 40px; }
  .search-inner { padding: 0 14px; }
  .search-bar { top: 100px; }
  .card-head { padding: 14px 16px; }
  .card-body { padding: 0 16px 14px; }
  .card-name { font-size: 15px; }
  .quick-links { grid-template-columns: 1fr; padding: 0 14px; }
}
</style>
</head>
<body>

<!-- 顶部 -->
<header class="header">
  <div class="header-inner">
    <div class="header-title">🏥 齐鲁会诊 · 每月更新版</div>
    <div class="header-stats">
      <span><span class="num" id="totalCount">—</span> 个专业</span>
      <span id="monthLabel">—</span>
      <a href="buildings.html" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;">🏗️ 楼宇指南</a>
    </div>
  </div>
</header>

<!-- 搜索 -->
<div class="search-bar">
  <div class="search-inner">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="搜索专业名称（心血管、骨科、麻醉…）" oninput="doSearch()">
      <button class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="search-hint" id="searchHint"></div>
</div>

<!-- 主内容 -->
<main class="main">
  <div class="card-grid" id="cardGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon">🔍</div>
    <p id="emptyMsg">未找到匹配的专业</p>
    <p class="sub">请尝试其他关键词</p>
  </div>
</main>

<div class="quick-links">
  <a class="ql-item" href="guide.html">
    <span class="ql-icon">📱</span>
    <span class="ql-text"><b>添加到手机桌面</b><small>像 App 一样用、可离线 · 点这里看教程</small></span>
  </a>
  <button class="ql-item" onclick="openFeedback('bug')">
    <span class="ql-icon">📮</span>
    <span class="ql-text"><b>数据有误？反馈</b><small>电话、病区写错了点这里告诉我们</small></span>
  </button>
  <button class="ql-item" onclick="openFeedback('wish')">
    <span class="ql-icon">💡</span>
    <span class="ql-text"><b>功能许愿</b><small>希望网站再加点什么功能</small></span>
  </button>
</div>

<div class="footer">💡 点击专业名称展开查看病区和电话 · 点电话直接拨打 · 点 ☆ 收藏常会诊的科室</div>

<!-- 反馈 / 功能许愿 弹窗（Netlify Forms，留言在 Netlify 后台 Forms 查看） -->
<div class="modal" id="fbModal">
  <div class="modal-box">
    <div class="modal-title" id="fbTitle">📮 数据反馈</div>
    <div class="modal-sub">你的每一条反馈我们都会看到，会尽快核对更新。</div>
    <form id="fbForm" name="qilu-feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="qilu-feedback">
      <p style="display:none"><label>请勿填写此项 <input name="bot-field"></label></p>
      <label>类型
        <select name="类型" id="fbType">
          <option value="数据纠错">数据纠错（电话 / 病区有误）</option>
          <option value="功能建议">功能建议（希望增加的功能）</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <label>内容
        <textarea name="内容" id="fbContent" required placeholder="数据纠错示例：心血管内科的电话应为 65055。&#10;功能建议示例：希望能查检验科送检时间。"></textarea>
      </label>
      <label>联系方式（可不填，方便我们回复你）
        <input name="联系方式" placeholder="微信号 / 手机号">
      </label>
      <div class="modal-actions">
        <button type="button" onclick="closeFeedback()">取消</button>
        <button type="submit" class="primary" id="fbSubmit">提交</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
function fullPhone(p) {
  if (!p) return '';
  return /^\d{5}$/.test(p) ? '821' + p : p;
}
function isShort(p) { return /^\d{5}$/.test(p); }
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let expanded = {};
let searchWord = '';

// 收藏（localStorage 持久化，按设备保存）
let favs = [];
try { favs = JSON.parse(localStorage.getItem('qilu_favs') || '[]'); } catch (e) { favs = []; }
function saveFavs() { try { localStorage.setItem('qilu_favs', JSON.stringify(favs)); } catch (e) {} }
function toggleFav(ev, id) {
  ev.stopPropagation();
  const i = favs.indexOf(id);
  if (i >= 0) { favs.splice(i, 1); showToast('已取消收藏'); }
  else { favs.push(id); showToast('已收藏，将置顶显示'); }
  saveFavs();
  render();
}

function render() {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const kw = searchWord.toLowerCase();
  let items = DATA.specialties;

  if (kw) {
    items = items.filter(item => {
      if (item.specialty.toLowerCase().includes(kw)) return true;
      return item.entries.some(e =>
        (e.ward||'').toLowerCase().includes(kw) ||
        (e.scope||'').toLowerCase().includes(kw) ||
        (e.location||'').toLowerCase().includes(kw) ||
        (e.phone||'').includes(kw) ||
        fullPhone(e.phone).includes(kw)
      );
    });
    // 急会诊始终置顶
    const ei = items.findIndex(i => i.id === 'emergency');
    if (ei > 0) { const e = items.splice(ei,1)[0]; items.unshift(e); }
  }

  // 排序：急会诊(2) > 收藏(1) > 普通(0)
  items.sort((a, b) => {
    const ra = a.id === 'emergency' ? 2 : (favs.includes(a.id) ? 1 : 0);
    const rb = b.id === 'emergency' ? 2 : (favs.includes(b.id) ? 1 : 0);
    return rb - ra;
  });

  document.getElementById('searchHint').classList.toggle('visible', kw.length > 0);
  if (kw) {
    document.getElementById('searchHint').textContent = `找到 ${items.length} 个匹配专业`;
  }

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('emptyMsg').textContent = kw ? `未找到"${esc(kw)}"相关专业` : '暂无会诊排班数据';
    return;
  }
  empty.style.display = 'none';

  const cards = items.map((item, idx) => {
    const em = item.isEmergency || false;
    const open = expanded[item.id] || false;
    const n = item.entries.length;
    // 急会诊：桌面端占满行，且第一个渲染
    const fullClass = (em && window.innerWidth > 768) ? ' emergency-full' : '';
    const isFav = favs.includes(item.id);

    let entriesHtml = item.entries.map(entry => {
      const fp = fullPhone(entry.phone);
      const s = isShort(entry.phone);
      return `
        <div class="entry">
          ${entry.scope && entry.scope !== '全部病区' ? `<div class="entry-title">${esc(entry.scope)}</div>` : ''}
          <div class="entry-meta">
            ${entry.ward ? `<span class="entry-meta-item"><span class="entry-meta-label">病区</span> ${esc(entry.ward)}</span>` : ''}
            ${entry.location ? `<span class="entry-meta-item"><span class="entry-meta-label">位置</span> ${esc(entry.location)}</span>` : ''}
          </div>
          <div class="phone-row">
            <a class="phone-link" href="tel:${fp}">
              <div class="phone-icon-circle">📞</div>
              <div class="phone-detail">
                <span class="phone-num">${esc(entry.phone)}</span>
                ${s ? `<span class="phone-full-num">全号 ${fp}</span>` : ''}
                <div class="phone-label">${esc(entry.label)}</div>
              </div>
            </a>
            <button class="copy-btn" onclick="event.stopPropagation();event.preventDefault();copyText('${fp}')">复制</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="card ${em ? 'emergency' : ''}${fullClass}">
        <div class="card-head" onclick="toggleCard('${item.id}')">
          <div class="card-left">
            <span class="card-icon">${em ? '🔴' : '🏥'}</span>
            <span class="card-name">${esc(item.specialty)}</span>
            ${n > 1 ? `<span class="card-badge">${n}项</span>` : ''}
          </div>
          <div class="card-right">
            ${n === 1 ? `<a class="quick-call" href="tel:${fullPhone(item.entries[0].phone)}" onclick="event.stopPropagation();" title="快速拨号">📞</a>` : ''}
            <button class="fav-btn${isFav ? ' on' : ''}" onclick="toggleFav(event,'${item.id}')" title="${isFav ? '取消收藏' : '收藏并置顶'}">${isFav ? '★' : '☆'}</button>
            <span class="chevron ${open ? 'open' : ''}">▶</span>
          </div>
        </div>
        <div class="card-body ${open ? 'open' : ''}">${entriesHtml}</div>
      </div>`;
  });

  // 在第一个收藏卡片前插入分组标题
  const firstFav = items.findIndex(it => it.id !== 'emergency' && favs.includes(it.id));
  if (firstFav > -1) {
    cards.splice(firstFav, 0, `<div class="section-divider">⭐ 我的收藏</div>`);
  }

  grid.innerHTML = cards.join('');
}

function toggleCard(id) {
  expanded[id] = !expanded[id];
  render();
}

function doSearch() {
  searchWord = document.getElementById('searchInput').value.trim();
  document.getElementById('clearBtn').classList.toggle('visible', searchWord.length > 0);
  render();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchWord = '';
  document.getElementById('clearBtn').classList.remove('visible');
  render();
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('已复制：' + text)).catch(() => showToast('复制失败，请手动复制'));
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===== 反馈 / 功能许愿（提交到 Netlify Forms，无需登录，后台可查看） =====
function openFeedback(kind) {
  const typeSel = document.getElementById('fbType');
  const title = document.getElementById('fbTitle');
  if (kind === 'wish') { typeSel.value = '功能建议'; title.textContent = '💡 功能许愿'; }
  else { typeSel.value = '数据纠错'; title.textContent = '📮 数据反馈'; }
  document.getElementById('fbModal').classList.add('show');
  setTimeout(() => document.getElementById('fbContent').focus(), 120);
}
function closeFeedback() {
  document.getElementById('fbModal').classList.remove('show');
}
document.getElementById('fbModal').addEventListener('click', (e) => {
  if (e.target.id === 'fbModal') closeFeedback();
});
document.getElementById('fbForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const btn = document.getElementById('fbSubmit');
  btn.disabled = true; btn.textContent = '提交中…';
  const body = new URLSearchParams(new FormData(this)).toString();
  fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
    .then((res) => {
      if (!res.ok) throw new Error(res.status);
      closeFeedback(); this.reset();
      showToast('已提交，感谢你的反馈！');
    })
    .catch(() => showToast('提交失败，请检查网络后重试'))
    .finally(() => { btn.disabled = false; btn.textContent = '提交'; });
});

// 初始化
document.getElementById('totalCount').textContent = DATA.specialties.length;
document.getElementById('monthLabel').textContent = DATA.month + ' · 更新：' + DATA.updateDate;
render();

// 窗口大小变化时刷新布局（急会诊占行策略变化）
window.addEventListener('resize', () => render());

// PWA：注册 Service Worker（离线缓存）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
