<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>齐鲁搬砖手册 - 会诊查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f0f4f8; color: #333; font-size: 14px; line-height: 1.6;
  max-width: 600px; margin: 0 auto; min-height: 100vh;
}

/* 顶部导航 */
.header {
  background: linear-gradient(135deg, #1a5f8a, #2C7FB8, #3a8ec9);
  color: #fff; padding: 16px 20px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }

/* 搜索栏 */
.search-wrap { padding: 12px 16px; }
.search-box {
  display: flex; align-items: center; background: #fff; border-radius: 24px;
  padding: 10px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.search-box input {
  flex: 1; border: none; outline: none; font-size: 15px; padding: 4px 0;
  background: transparent;
}
.search-box input::placeholder { color: #bbb; }
.clear-btn {
  width: 28px; height: 28px; border-radius: 50%; background: #e0e0e0;
  color: #fff; border: none; font-size: 14px; cursor: pointer; display: none;
  align-items: center; justify-content: center;
}
.clear-btn.show { display: flex; }
.result-hint { padding: 0 20px 8px; font-size: 12px; color: #999; display: none; }
.result-hint.show { display: block; }

/* 列表 */
.list { padding: 0 14px 40px; }

/* 卡片 */
.card {
  background: #fff; border-radius: 12px; margin-bottom: 10px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04); overflow: hidden;
}
.card.emergency { border-left: 4px solid #e74c3c; background: #fffafa; }
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; cursor: pointer; user-select: none;
}
.card.emergency .card-head { background: linear-gradient(90deg, #fef0f0, #fff); }
.card-head:active { background: #fafafa; }
.card-left { display: flex; align-items: center; gap: 8px; flex: 1; }
.card-name {
  font-size: 16px; font-weight: 600; color: #1a1a1a;
}
.card.emergency .card-name { color: #c0392b; }
.card-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 8px;
  background: #fff3e0; color: #e67e22;
}
.call-mini {
  width: 40px; height: 40px; border-radius: 50%; background: #e8f4fd;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  margin-right: 8px; flex-shrink: 0;
}
.arrow { font-size: 20px; color: #bbb; transition: transform 0.2s; }
.arrow.open { transform: rotate(90deg); }

/* 展开内容 */
.card-body { display: none; padding: 0 16px 14px; border-top: 1px solid #f2f2f2; }
.card-body.open { display: block; }
.entry {
  padding: 12px 0; border-bottom: 1px solid #fafafa;
}
.entry:last-child { border-bottom: none; }
.entry-title {
  font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px;
}
.entry-info { font-size: 13px; color: #666; margin-bottom: 8px; }
.entry-info span { margin-right: 12px; }
.info-label { color: #999; }

/* 电话行 */
.phone-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; background: #f8fafc; border-radius: 10px;
}
.phone-link {
  display: flex; align-items: center; gap: 10px; text-decoration: none;
  color: inherit; flex: 1;
}
.phone-num {
  font-size: 16px; font-weight: 700; color: #2C7FB8;
}
.phone-full-num { font-size: 11px; color: #999; margin-left: 4px; }
.phone-label { font-size: 11px; color: #999; display: block; }
.copy-btn {
  padding: 6px 14px; background: #e8f4fd; color: #2C7FB8;
  border: none; border-radius: 6px; font-size: 12px; cursor: pointer;
}
.copy-btn:active { background: #d0e8f8; }
.toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.75); color: #fff; padding: 10px 24px;
  border-radius: 8px; font-size: 14px; z-index: 999; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }

/* 空状态 */
.empty { text-align: center; padding: 60px 20px; color: #999; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

/* 底部 */
.footer { text-align: center; padding: 24px; color: #bbb; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>📋 齐鲁搬砖手册</h1>
  <div class="sub" id="monthInfo">会诊排班</div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span style="opacity:0.4;margin-right:6px;">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索专业名称（如：心血管、骨科...）" oninput="doSearch()">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</div>
<div class="result-hint" id="resultHint"></div>

<div class="list" id="list"></div>

<div class="empty" id="empty" style="display:none">
  <div class="icon">🔍</div>
  <div>未找到匹配的专业</div>
  <div style="color:#bbb;font-size:12px;margin-top:4px;">请尝试其他关键词</div>
</div>

<div class="footer">💡 点击专业名展开查看详情，点击电话直接拨打</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
// ===== 电话号转换 =====
function fullPhone(p) {
  if (!p) return '';
  if (/^\d{5}$/.test(p)) return '821' + p;
  return p;
}
function isShort(p) { return /^\d{5}$/.test(p); }

// ===== 渲染 =====
let expanded = {};
let searchWord = '';

function render() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const kw = searchWord.toLowerCase();
  let items = DATA.specialties;

  if (kw) {
    items = items.filter(item => {
      if (item.specialty.toLowerCase().includes(kw)) return true;
      return item.entries.some(e =>
        (e.ward||'').includes(kw) || (e.scope||'').includes(kw) ||
        (e.location||'').includes(kw) || (e.phone||'').includes(kw) ||
        fullPhone(e.phone).includes(kw)
      );
    });
    // 急会诊置顶
    const ei = items.findIndex(i => i.id === 'emergency');
    if (ei > 0) { const e = items.splice(ei,1)[0]; items.unshift(e); }
  }

  if (items.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('resultHint').classList.remove('show');
    return;
  }
  empty.style.display = 'none';

  if (kw) {
    const h = document.getElementById('resultHint');
    h.textContent = `找到 ${items.length} 个匹配专业`;
    h.classList.add('show');
  } else {
    document.getElementById('resultHint').classList.remove('show');
  }

  list.innerHTML = items.map(item => {
    const isEmergency = item.isEmergency || false;
    const open = expanded[item.id] || false;
    const entryCount = item.entries.length;

    let entriesHtml = item.entries.map(entry => {
      const fp = fullPhone(entry.phone);
      const short = isShort(entry.phone);
      return `
        <div class="entry">
          ${entry.scope && entry.scope !== '全部病区' ? `<div class="entry-title">${esc(entry.scope)}</div>` : ''}
          <div class="entry-info">
            ${entry.ward ? `<span><span class="info-label">病区</span> ${esc(entry.ward)}</span>` : ''}
            ${entry.location ? `<span><span class="info-label">位置</span> ${esc(entry.location)}</span>` : ''}
          </div>
          <div class="phone-row">
            <a class="phone-link" href="tel:${fp}">
              <span style="font-size:22px;">📞</span>
              <div>
                <span class="phone-num">${esc(entry.phone)}</span>
                ${short ? `<span class="phone-full-num">（全号：${fp}）</span>` : ''}
                <span class="phone-label">${esc(entry.label)}</span>
              </div>
            </a>
            <button class="copy-btn" onclick="event.stopPropagation();copyText('${fp}')">复制</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="card ${isEmergency ? 'emergency' : ''}">
        <div class="card-head" onclick="toggleCard('${item.id}')">
          <div class="card-left">
            <span class="card-name">${esc(item.specialty)}</span>
            ${entryCount > 1 ? `<span class="card-badge">${entryCount}个分项</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;">
            ${entryCount === 1 ? `<a class="call-mini" href="tel:${fullPhone(item.entries[0].phone)}" onclick="event.stopPropagation();">📞</a>` : ''}
            <span class="arrow ${open ? 'open' : ''}">›</span>
          </div>
        </div>
        <div class="card-body ${open ? 'open' : ''}">${entriesHtml}</div>
      </div>`;
  }).join('');
}

function toggleCard(id) {
  expanded[id] = !expanded[id];
  render();
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 搜索 =====
function doSearch() {
  searchWord = document.getElementById('searchInput').value.trim();
  document.getElementById('clearBtn').classList.toggle('show', searchWord.length > 0);
  render();
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchWord = '';
  document.getElementById('clearBtn').classList.remove('show');
  render();
}

// ===== 复制 =====
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('已复制：' + text));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ===== 初始化 =====
document.getElementById('monthInfo').textContent =
  DATA.month + ' 会诊排班 · 共 ' + DATA.specialties.length + ' 个专业 · 更新：' + DATA.updateDate;
render();
</script>
</body>
</html>
